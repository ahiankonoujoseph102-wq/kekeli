name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kekeli_test
          POSTGRES_USER: kekeli
          POSTGRES_PASSWORD: kekeli_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kekeli_test
      DB_USERNAME: kekeli
      DB_PASSWORD: kekeli_ci

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Préparer le fichier d'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Construire l'interface
        run: npm run build

      - name: Lancer les tests sur PostgreSQL
        run: php artisan test

  runner:
    runs-on: ubuntu-latest
    # Un test bloqué ne doit jamais occuper la vérification pendant des heures.
    timeout-minutes: 10

    defaults:
      run:
        working-directory: runner

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: runner/package-lock.json

      - name: Installer les dépendances du Runner
        run: npm ci

      - name: Lancer les tests du Runner
        run: npm test
